<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Skills, Method &amp; AI — Session 1: Research Plan — Review Edition</title><style>@font-face{font-family:'Deck Sans';src:url(./assets/deck-sans.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* === NAVIGATION AND MANUAL PROGRESSIVE REVEALS === */
class SlidePresentation{
constructor(){this.slides=[...document.querySelectorAll('.slide')];this.currentSlide=0;this.reveals=this.slides.map(()=>0);this.jump=document.getElementById('jump');this.jump.innerHTML=source.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title)}</option>`).join('');this.jump.onchange=()=>this.showSlide(+this.jump.value);document.getElementById('next').onclick=()=>this.next();document.getElementById('prev').onclick=()=>this.prev();window.addEventListener('resize',()=>this.scale());// Navigation is explicit: slide clicks and selection gestures never advance.
document.addEventListener('keydown',e=>{
 const target=e.target;
 const focused=document.activeElement;
 const editing=element=>element instanceof Element&&(element.isContentEditable||element.closest('input,textarea,select,[role="textbox"]'));
 if(e.defaultPrevented||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||editing(target)||editing(focused))return;
 if(target instanceof Element&&target.closest('button,a'))return;
 if(e.key==='ArrowRight'){e.preventDefault();this.next()}
 else if(e.key==='ArrowLeft'){e.preventDefault();this.prev()}
});
this.scale();this.showSlide(Math.max(0,Math.min(this.slides.length-1,parseInt(location.hash.slice(1))-1||0)))}
scale(){const available=innerHeight-56;const z=Math.min(innerWidth/1920,available/1080);document.getElementById('deckStage').style.transform=`translate(${(innerWidth-1920*z)/2}px,${(available-1080*z)/2}px) scale(${z})`}
showSlide(i){if(i<0||i>=this.slides.length)return;if(this.currentSlide!==i&&source[this.currentSlide].original===23)pauseTimer();this.currentSlide=i;this.slides.forEach((s,j)=>{s.classList.toggle('active',j===i);s.inert=j!==i;s.setAttribute('aria-hidden',j!==i)});this.paint();this.jump.value=i;history.replaceState(null,'','#'+(i+1));document.getElementById('nav-status').textContent=`${i+1} / ${this.slides.length}`;document.getElementById('prev').disabled=i===0&&this.reveals[i]===0;document.getElementById('next').disabled=i===this.slides.length-1;}
paint(){this.slides[this.currentSlide].querySelectorAll('.step').forEach((x,j)=>x.classList.toggle('shown',j<this.reveals[this.currentSlide]));}
next(){const i=this.currentSlide,n=this.slides[i].querySelectorAll('.step').length;if(this.reveals[i]<n){this.reveals[i]++;this.paint()}else this.showSlide(i+1)}
prev(){const i=this.currentSlide;if(this.reveals[i]>0){this.reveals[i]--;this.paint()}else this.showSlide(i-1)}
}

const activities=[['Part 1 — Individual Work (15 minutes)','Develop your research idea using the Research Hierarchy Template.','Upload your completed research framework to KEDGE Learn.'],['Part 2 — Group Discussion (15 minutes)','Share your ideas with your group.','Evaluate the research questions using the five criteria:','Clarity','Relevance','Researchability','Feasibility','Focus'],['Part 3 — Class Sharing (15 minutes)','Each group presents one research idea.','Explain the focused topic, research problem, and proposed research questions.']];
const timers=activities.map(()=>({remaining:900000,running:false,end:0}));let activity=0;
function remaining(t){return t.running?Math.max(0,t.end-performance.now()):t.remaining}
function pauseTimer(){const t=timers[activity];t.remaining=remaining(t);t.running=false;drawTimer()}
function drawTimer(){const t=timers[activity];let r=remaining(t);if(r<=0){t.running=false;t.remaining=0}const sec=Math.ceil(r/1000);document.getElementById('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;document.getElementById('timer-progress').value=r/1000;document.getElementById('timer-status').textContent=r===0?"Time's Up!":t.running?'Running':r===900000?'Ready':'Paused';document.getElementById('timer-pause').textContent=t.running?'Pause':'Resume';document.getElementById('timer-start').disabled=t.running||r===0;document.getElementById('timer-pause').disabled=r===0;document.getElementById('timer').style.color=r===0?'#a43e32':''}

document.getElementById('timer-start').onclick=()=>{const t=timers[activity];if(!t.running&&t.remaining>0){t.end=performance.now()+t.remaining;t.running=true;drawTimer()}};
document.getElementById('timer-pause').onclick=()=>{const t=timers[activity];if(t.running)pauseTimer();else if(t.remaining>0){t.end=performance.now()+t.remaining;t.running=true;drawTimer()}};

for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[initialHierarchyOrder[j],initialHierarchyOrder[k]]=[initialHierarchyOrder[k],initialHierarchyOrder[j]]}

/* Scoped shared-card continuity: synchronous navigation, no clones or overlays. */
const baseResearchShowSlide=SlidePresentation.prototype.showSlide;
let researchNavigationAnimations=[];
const researchContinuityPairs=[
 {from:'slide-15',to:'slide-16',out:'.domain-switch:last-child',into:'.topic-initial'},
 {from:'slide-16',to:'slide-17',out:'.topic-focus',into:'.question-stack .card:first-child'},
 {from:'slide-17',to:'research-question-transition',out:'.transition-reveal',into:'.question-stack .card:first-child'},
 {from:'research-question-transition',to:'slide-18',out:'.transition-reveal',into:'.main-question'}
];
function cancelResearchNavigationAnimations(){researchNavigationAnimations.forEach(animation=>animation.cancel());researchNavigationAnimations=[]}
SlidePresentation.prototype.showSlide=function(index){
 if(index<0||index>=this.slides.length)return;
 cancelResearchNavigationAnimations();
 const from=this.slides[this.currentSlide],to=this.slides[index];
 const pair=researchContinuityPairs.find(p=>(p.from===from?.id&&p.to===to.id)||(p.to===from?.id&&p.from===to.id));
 const forward=pair&&pair.from===from.id;
 const sourceCard=pair&&from.querySelector(forward?pair.out:pair.into);
 const fromRect=sourceCard?.getBoundingClientRect();
 baseResearchShowSlide.call(this,index);
 if(from!==to&&(from?.id==='research-question-criteria'||to.id==='research-question-criteria')){
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const animation=to.querySelector('.content').animate([{opacity:0},{opacity:1}],{duration:250,easing:'ease-in-out'});researchNavigationAnimations.push(animation);animation.finished.catch(()=>{})}
  return;
 }
 if(!pair||!fromRect||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const targetCard=to.querySelector(forward?pair.into:pair.out),toRect=targetCard.getBoundingClientRect();
 const stageScale=document.getElementById('deckStage').getBoundingClientRect().width/1920;
 const dx=((fromRect.left+fromRect.width/2)-(toRect.left+toRect.width/2))/stageScale;
 let dy=((fromRect.top+fromRect.height/2)-(toRect.top+toRect.height/2))/stageScale;
 // On Slide 22, keep moving shared cards inside the question stack, clear of criteria.
 if(to.id==='research-question-transition'){const stack=to.querySelector('.question-stack').getBoundingClientRect();dy=Math.max((stack.top-toRect.top)/stageScale,Math.min(dy,(stack.bottom-toRect.bottom)/stageScale))}
 const animate=(element,keyframes,options)=>{const animation=element.animate(keyframes,options);researchNavigationAnimations.push(animation);animation.finished.catch(()=>{});return animation};
 animate(targetCard,[{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:650,easing:'ease-in-out'});
 // Fade only siblings of the shared card; leave the card and slide chrome continuous.
 const fadeNewContent=element=>{for(const child of element.children){if(child===targetCard)continue;if(to.id==='research-question-transition'&&child.matches('.quality-criteria'))continue;if(child.contains(targetCard))fadeNewContent(child);else animate(child,[{opacity:0},{opacity:1}],{duration:150,delay:500,fill:'backwards',easing:'ease-in-out'})}};
 fadeNewContent(to.querySelector('.content'));
};
window.addEventListener('resize',cancelResearchNavigationAnimations);
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',cancelResearchNavigationAnimations);
