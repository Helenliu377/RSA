   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {

        transition-duration: 0.2s !important;
    }

mic literature", "□ Choose and justify an appropriate research methodology", "□ Plan ethical and systematic data collection", "□ Analyze preliminary data and communicate findings", "Codex instructions:", "- Present the six outcomes as an interactive checklist.", "- Use clickable checkboxes that turn into green ticks.", "- Keep all six outcomes visible on one slide.", "- Allow the teacher to tick each outcome as it is achieved.", "- Include a reset button.", "- No automatic ticking based on session completion.", "B. Master’s thesis requirements and logistics"]}, {"original": 8, "title": "What Is a Master's Dissertation?", "paragraphs": ["Content:", "An individual research project that addresses a specific managerial or theoretical question.", "It involves:", "1. Formulating a clear research question.", "2. Reviewing relevant academic literature.", "3. Collecting and analyzing empirical data.", "4. Developing evidence-based conclusions and recommendations.", "A dissertation is not an internship report.", "Codex instructions:", "Use a simple four-step research process diagram.", "Highlight the distinction between a dissertation and an internship report.", "Keep the layout professional and easy to follow."]}, {"original": 9, "title": "MSc Marketing Dissertation Requirements", "paragraphs": ["Content:", "20 ECTS credits", "Written dissertation:", "- Approximately 50–60 pages of main text.", "- Maximum 80 pages including references and appendices.", "- Literature review and empirical research required.", "- APA referencing standards.", "Oral defence:", "- Mandatory.", "- Present and defend research findings.", "Assessment:", "- Written dissertation: 60%.", "- Oral defence: 40%.", "Codex instructions:", "Use a two-column layout: Written Dissertation and Oral Defence.", "Display 20 ECTS and the 60% / 40% assessment weights prominently.", "Keep the layout concise and professional"]}, {"original": 10, "title": "Structure of the MSc Marketing Dissertation", "paragraphs": ["Content:", "1. Introduction", "Research context, problem, research question, and objectives.", "2. Literature Review", "Relevant academic research, key concepts, and theoretical framework.", "3. Empirical Study", "Research methodology, data collection, and analysis.", "4. Discussion and Recommendations", "Interpretation of findings and managerial implications.", "5. Conclusion", "Main findings, limitations, and future research directions.", "Additional requirements:", "APA reference list and relevant appendices.", "Codex instructions:", "- Present the five sections as a structured research journey.", "- Use a simple vertical flowchart or numbered sequence.", "- Keep descriptions concise and readable.", "- Do not include the alternative dissertation formats or their page allocations.", "- No interactive functions required."]}, {"original": 11, "title": "MSc Marketing Dissertation Documents", "paragraphs": ["### Content", "Before starting your dissertation, download and read the following official documents.", "**Document 1: Student Guide – MSc Marketing**", "File location: `documents/STUDENT_GUIDE_MSc_MARKETING_2025-2026.pdf`", "**Document 2: Dissertation Modalities – MSc Marketing**", "File location: `documents/DISSERTATION_MODALITIES_MSc_MARKETING_2025-2026.pdf`", "**Instructions for students:**", "1. Download both PDF documents.", "2. Open the documents on your computer.", "3. Use Ctrl + F (Windows) or Cmd + F (Mac) to search for important requirements.", "### Codex Instructions", "- Create two document cards displayed side by side.", "- Each card should display the document title, a PDF icon, and a functional **Download PDF** button.", "- Use the original PDF files from the `documents/` folder.", "- Use the following relative file paths:", "- Document 1: `./documents/STUDENT_GUIDE_MSc_MARKETING_2025-2026.pdf`", "- Document 2: `./documents/DISSERTATION_MODALITIES_MSc_MARKETING_2025-2026.pdf`", "- Ensure the Download PDF buttons point directly to the corresponding local files.", "- Use the HTML `download` attribute to enable downloading.", "- Ensure both PDF files remain accessible when the HTML presentation is distributed with its accompanying folders.", "- Do not embed or modify the PDF documents.", "- Display the student instructions below the two cards.", "- Maintain the existing professional slide design.", "- Do not add extra content or summarize the documents.", "- Verify that both file paths and filenames match the actual files, including capitalization."]}, {"original": 13, "title": "Class Activity – Explore the Dissertation Platform", "paragraphs": ["Content:", "Access the platform:", "https://memoires.kedgebs.com/Login.aspx", "Your tasks:", "1. Log in using your KEDGE credentials.", "2. Open the \"Documentation\" menu.", "3. Find and review the following documents:", "STYLE SHEET ENGLISH", "EXAMPLE OF DISSERTATION - MASTER'S THESIS FINAL EN", "4. Explore the other tabs and available features.", "Important:", "Do not submit, confirm, or validate any requests during this activity.", "Codex instructions:", "Create an interactive class activity slide.", "Include a functional \"Open Platform\" button that opens the website in a new browser tab.", "Display the two document titles prominently and exactly as written.", "Present the activity as a numbered sequence.", "Highlight the warning about not submitting or validating requests.", "Maintain the existing slide design.", "Do not embed the platform or collect login credentials.", "C. The research journey and thesis quality"]}, {"original": 14, "title": "The Research Journey", "paragraphs": ["Content:", "1. Identify a Problem", "What marketing problem or question do you want to investigate?", "2. Review Existing Knowledge", "What does academic research already tell us?", "3. Design Your Research", "Which methods and data can help answer your question?", "4. Collect and Analyze Evidence", "What patterns, relationships, or insights emerge?", "5. Draw Conclusions", "What can you hat would you ask?", "1. Sample: Who was surveyed? Are they representative of our target customers?", "2. Research Design: How were the questions designed? Could they influence the answers?", "3. Reliability: Does stated interest translate into actual purchasing behavior?", "4. Missing Factors: What competitors, costs, and market risks have been overlooked?", "5. Decision: What additional evidence would help us make a better decision?", "Key message:", "Good managers do not simply accept research findings. They critically evaluate the evidence behind them.", "Codex Instructions:", "Create an interactive classroom discussion slide.", "Display the scenario prominently at the top.", "Initially show only the scenario and the question: \"Before approving the launch, what would you ask?\"", "Reveal the five questions one by one when the instructor clicks or advances.", "Use five numbered cards with short headings: Sample, Research Design, Reliability, Missing Factors, Decision.", "Reveal the key message after all five questions.", "Maintain the existing professional visual style.", "The 80% figure is hypothetical and should not be presented as a real research finding."]}, {"original": 17, "title": "What Makes a High-Quality Dissertation?", "paragraphs": ["Content:", "FORM — 30% of Written Dissertation Score", "Spelling and grammar quality", "Style and clarity", "Observance of presentation standards", "Relationship with tutor and professionalism", "CONTENT — 70% of Written Dissertation Score", "Formulation and relevance of issue", "Clarity of dissertation objectives", "Quality of literature review", "Quality of conceptual developments", "Quality of method", "Quality and appropriate nature of analysis", "Relevance of recommendations", "Source:", "The KEDGE Dissertation – Student Guide", "Appendix 4: Assessment Scale, page 12", "Codex Instructions:", "Create a two-column layout comparing FORM (30%) and CONTENT (70%).", "Use the exact assessment criteria from the official guide.", "Display the percentages prominently.", "Give the CONTENT column slightly more visual space because it contains seven criteria.", "Make clear that 30% and 70% refer to the written dissertation score, not the overall grade.", "Add a small source reference at the bottom.", "Maintain the existing professional design.", "No interactive functions required.", "D. Topic, problem and research question"]}, {"original": 17.5, "title": "Understanding the Research Hierarchy", "paragraphs": []}, {"original": 18, "title": "From Research Domain to Research Topic", "paragraphs": ["CONTENT", "01 — Research Domain", "A broad academic field or area of interest.", "02 — Research Topic", "A specific subject of interest within a research domain.", "Key Message:", "A research topic begins with a broad area of interest, but usually needs further refinement.", "INTERACTIVE EXAMPLES", "Research Domain → Consumer Behavior", "Research Topic → Gender Cues in Wine Marketing", "CODEX INSTRUCTIONS", "Create two large vertically connected cards: Research Domain → Research Topic.", "Initially show only the general concepts and their definitions.", "Each card must be independently clickable.", "Clicking a card replaces its general definition with the corresponding wine marketing example.", "Clicking the same card again returns to the general definition.", "Use a subtle flip or fade transition.", "Do not navigate to another slide when a card is clicked.", "Add a small visual hint: \"Click to see an example.\"", "Use generous whitespace and large, classroom-readable typography."]}, {"original": 19, "title": "From a Broad Topic to a Focused Topic", "paragraphs": ["CONTENT", "Initial Topic:", "Gender and Consumer Behavior", "Refine the Scope:", "Context — Wine Market", "Specific Factor — Winemaker Gender Cues", "Outcome — Consumer Evaluations", "Focused Topic:", "The Influence of Winemaker Gender Cues on Consumer Evaluations of Wine", "Key Message:", "A focused topic specifies what you study, in which context, and which aspect you want to understand.", "CODEX INSTRUCTIONS", "Create a vertical narrowing diagram with three stages:", "1. Initial Topic", "2. Refine the Scope", "3. Focused Topic", "Display the three scope dimensions as compact cards: Context, Specific Factor, Outcome.", "Use arrows to demonstrate how the broad idea becomes more focused.", "Highlight the focused topic visually.", "Reveal the stages sequentially when advancing the slide.", "Keep the wording short and the layout clean."]}, {"original": 20, "title": "From Topic to Research Question", "paragraphs": ["CONTENT", "Focused Topic:", "The Influence of Winemaker Gender Cues on Consumer Evaluations of Wine", "Research Problem:", "It is unclear whether and how winemaker gender cues affect consumers' evaluations and purchasing decisions.", "Main Research Question:", "How do winemaker gender cues influence consumers' evaluations and purchasing decisions in the wine market?", "Five Criteria for a Good Research Question:", "Clarity — Is it specific and understandable?", "Relevance — Does it address a meaningful issue?", "Researchability — Can it be investigated using evidence?", "Feasibility — Can it be answered with available time and resources?", "Focus — Is its scope sufficiently narrow?", "Key Message:", "A good research question is clear, relevant, researchable, feasible, and focused.", "CODEX INSTRUCTIONS", "Create a three-level vertical diagram:", "Focused Topic → Research Problem → Main Research Question.", "Use arrows to connect the three levels.", "Highlight the main research question.", "Below the diagram, display five compact criteria cards:", "Clarity, Relevance, Researchability, Feasibility, Focus.", "Each card contains the short guiding question.", "Reveal the diagram progressively before displaying the five criteria.", "Keep all content readable on one slide.", "Maintain the existing academic visual style."]}, {"original": 21, "title": "Main and Specific Research Questions", "paragraphs": ["CONTENT", "Main Research Question:", "How do winemaker gender cues influence consumers' evaluations and purchasing decisions in the wine market?", "RQ1 — Quality Perception", "How do gender cues influence perceived wine quality and expected taste?", "RQ2 — Product Choice", "How do gender cues influence wine choice?", "RQ3 — Willingness to Pay", "How do gender cues influence willingness to pay?", "Key Message:", "One main research question can be divided into several complementary questions, each examining a different dimension.", "CODEX INSTRUCTIONS", "Create a hierarchical research question map.", "Place the main research question in a large box at the top.", "Connect it to three equally sized cards below:", "RQ1 — Quality Perception", "RQ2 — Product Choice", "RQ3 — Willingness to Pay", "Display the corresponding research question inside each card.", "Use clear connecting lines.", "Reveal the three specific questions sequentially.", "Avoid repeating the topic and research problem from previous slides.", "Maintain consistent typography and colors."]}, {"original": 22, "title": "The Complete Research Hierarchy", "paragraphs": ["CONTENT", "01 — Research Domain", "Consumer Behavior", "02 — Initial Research Topic", "Gender Cues in Wine Marketing", "03 — Focused Research Topic", "Winemaker Gender Cues and Consumer Evaluations of Wine", "04 — Research Problem", "Uncertainty about how winemaker gender cues influence consumer evaluations and purchasing decisions.", "05 — Main Research Question", "How do winemaker gender cues influence consumers' evaluations and purchasing decisions in the wine market?", "06 — Specific Research Questions", "Quality Perception", "Product Choice", "Willingness to Pay", "Key Message:", "Research develops through refinement. Your topic, problem, and questions may evolve as you review the literature.", "CODEX INSTRUCTIONS", "Create a six-level research hierarchy using a vertical flowchart or narrowing diagram.", "Connect all six levels w const beforeBatch1419Render=render;
const focusedTopic='The Influence of Winemaker Gender Cues on Consumer Evaluations of Wine';

const stageHeading=o=>{const active={18:[0,1],19:[1],20:[1,2,3],21:[3]}[o];return ['Domain','Topic','Problem','Research Question'].map((t,j)=>`${j?`<span class="progress-arrow ${active.includes(j)&&active.includes(j-1)?'current':''}" aria-hidden="true">→</span>`:''}<span class="${active.includes(j)?'current':''}">${t}</span>`).join('')};

if(s.original===20){const cards=[['Focused Topic',focusedTopic],['Research Problem',researchProblem],['Main Research Question',mainRQ]];const criteria=[['Clarity','Is it specific and understandable?'],['Relevance','Does it address a meaningful issue?'],['Researchability','Can it be investigated using evidence?'],['Feasibility','Can it be answered with available time and resources?'],['Focus','Is its scope sufficiently narrow?']];return `<div class="content"><div class="question-stack">${cards.map(([h,t],j)=>`${j?'<div class="gap-arrow" aria-hidden="true">↓</div>':''}${card(h,t,j===2?'accent':'')}`).join('')}</div><div class="quality-criteria">${criteria.map(([h,t])=>card(h,t)).join('')}</div>${msg('A good research question is clear, relevant, researchable, feasible, and focused.')}</div>`}
if(s.original===21){const questions=[['RQ1 — Quality Perception','How do gender cues influence perceived wine quality and expected taste?'],['RQ2 — Product Choice','How do gender cues influence wine choice?'],['RQ3 — Willingness to Pay','How do gender cues influence willingness to pay?']];return `<div class="content"><div class="mind-map">${card('Main Research Question',mainRQ,'accent main-question')}<div class="map-lines" aria-hidden="true"><span class="map-trunk"></span><span class="map-branch"></span><span class="map-drop"></span><span class="map-drop"></span><span class="map-drop"></span></div>${questions.map(([h,t])=>card(h,t,'specific-question')).join('')}</div>${msg('One main research question can be divided into several complementary questions, each examining a different dimension.')}</div>`}
if(s.original===22)return `<div class="content"><div class="summary-grid">${[['Research Domain','Consumer Behavior'],['Research Topic',focusedTopic],['Research Problem',researchProblem],['Research Question',mainRQ]].map(([h,t])=>`<div class="card summary-label"><h3>${h}</h3></div><div class="card summary-example"><p>${esc(t)}</p></div>`).join('')}</div></div>`;

/* === SHARED AGENDA; EXACT CHAPTER NAMES AND LINE BREAKS === */
const chapters=['Course Introduction','Dissertation Requirements & Logistics','Research Journey & Thesis Quality','Topic, Problem & Research Question','Research Proposal'];

document.getElementById('deckStage').innerHTML=source.map((s,i)=>`<section class="slide" id="slide-${i+1}" aria-label="Slide ${i+1}: ${esc(s.title)}" data-original="${s.original}"><header><span>Research Skills, Ethics &amp; AI · Session 1: Research Plan</span><span>${section(s.original)}</span></header>${s.original===1?'':[18,19,20,21].includes(s.original)?`<nav class="research-progress" aria-label="Research hierarchy progress">${stageHeading(s.original)}</nav>`:`<div class="heading"><h2>${esc(s.title)}</h2></div>`}${render(s,i)}<footer><span>KEDGE Business School · L. Liu &amp; Dr. Mo Cheded</span><span>${String(i+1).padStart(2,'0')} / ${source.length}</span></footer></section>`).join('');

/* === NAVIGATION AND MANUAL PROGRESSIVE REVEALS === */
class SlidePresentation{
constructor(){this.slides=[...document.querySelectorAll('.slide')];this.currentSlide=0;this.reveals=this.slides.map(()=>0);this.jump=document.getElementById('jump');this.jump.innerHTML=source.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title)}</option>`).join('');this.jump.onchange=()=>this.showSlide(+this.jump.value);document.getElementById('next').onclick=()=>this.next();document.getElementById('prev').onclick=()=>this.prev();window.addEventListener('resize',()=>this.scale());// Navigation is explicit: slide clicks and selection gestures never advance.
document.addEventListener('keydown',e=>{
 const target=e.target;
 const focused=document.activeElement;
 const editing=element=>element instanceof Element&&(element.isContentEditable||element.closest('input,textarea,select,[role="textbox"]'));
 if(e.defaultPrevented||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||editing(target)||editing(focused))return;
 if(target instanceof Element&&target.closest('button,a'))return;
 if(e.key==='ArrowRight'){e.preventDefault();this.next()}
 else if(e.key==='ArrowLeft'){e.preventDefault();this.prev()}
});
this.scale();this.showSlide(Math.max(0,Math.min(this.slides.length-1,parseInt(location.hash.slice(1))-1||0)))}
scale(){const available=innerHeight-56;const z=Math.min(innerWidth/1920,available/1080);document.getElementById('deckStage').style.transform=`translate(${(innerWidth-1920*z)/2}px,${(available-1080*z)/2}px) scale(${z})`}
showSlide(i){if(i<0||i>=this.slides.length)return;if(this.currentSlide!==i&&source[this.currentSlide].original===23)pauseTimer();this.currentSlide=i;this.slides.forEach((s,j)=>{s.classList.toggle('active',j===i);s.inert=j!==i;s.setAttribute('aria-hidden',j!==i)});this.paint();this.jump.value=i;history.replaceState(null,'','#'+(i+1));document.getElementById('nav-status').textContent=`${i+1} / ${this.slides.length}`;document.getElementById('prev').disabled=i===0&&this.reveals[i]===0;document.getElementById('next').disabled=i===this.slides.length-1;}
paint(){this.slides[this.currentSlide].querySelectorAll('.step').forEach((x,j)=>x.classList.toggle('shown',j<this.reveals[this.currentSlide]));}
next(){const i=this.currentSlide,n=this.slides[i].querySelectorAll('.step').length;if(this.reveals[i]<n){this.reveals[i]++;this.paint()}else this.showSlide(i+1)}
prev(){const i=this.currentSlide;if(this.reveals[i]>0){this.reveals[i]--;this.paint()}else this.showSlide(i-1)}
}
/* === INDEPENDENT TOGGLES, CHECKLISTS, COPY AND ACCORDION === */
document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.querySelector('.definition').hidden=on;b.querySelector('.example').hidden=!on});
document.getElementById('reset-outcomes').onclick=()=>document.querySelectorAll('#outcomes input').forEach(x=>x.checked=false);
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(b.dataset.copy);ok=true}catch{const t=document.createElement('textarea');t.value=b.dataset.copy;document.body.append(t);t.select();ok=document.execCommand('copy');t.remove();b.focus()}document.getElementById('copy-status').textContent=ok?'Copied: '+b.dataset.copy:'Copy unavailable. Select and copy the keyword manually.'});
document.querySelectorAll('.component button').forEach(b=>b.onclick=()=>{const open=b.getAttribute('aria-expanded')!=='true';document.querySelectorAll('.component').forEach(c=>{const on=c===b.parentElement&&open;c.classList.toggle('open',on);c.querySelector('button').setAttribute('aria-expanded',on);c.querySelector('button span').textContent=on?'−':'+'})});
/* === THREE INDEPENDENT ELAPSED-TIME COUNTDOWNS === */
const activities=[['Part 1 — Individual Work (15 minutes)','Develop one research idea and identify:','Research domain','Initial and focused research topic','Research problem','Main research question and possible specific research questions'],['Part 2 — Group Discussion (15 minutes)','Share your ideas with your group.','Evaluate the research questions using the five criteria:','Clarity','Relevance','Researchability','Feasibility','Focus'],['Part 3 — Class Sharing (15 minutes)','Each group presents one research idea.','Explain the focused topic, research problem, and proposed research questions.']];
const timers=activities.map(()=>({remaining:900000,running:false,end:0}));let activity=0;
function remaining(t){return t.running?Math.max(0,t.end-performance.now()):t.remaining}
function pauseTimer(){const t=timers[activity];t.remaining=remaining(t);t.running=false;drawTimer()}
function drawTimer(){const t=timers[activity];let r=remaining(t);if(r<=0){t.running=false;t.remaining=0}const sec=Math.ceil(r/1000);document.getElementById('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;document.getElementById('timer-progress').value=r/1000;document.getElementById('timer-status').textContent=r===0?"Time's Up!":t.running?'Running':r===900000?'Ready':'Paused';document.getElementById('timer-pause').textContent=t.running?'Pause':'Resume';document.getElementById('timer-start').disabled=t.running||r===0;document.getElementById('timer-pause').disabled=r===0;document.getElementById('timer').style.color=r===0?'#a43e32':''}
function chooseActivity(i){pauseTimer();activity=i;document.getElementById('activity-instructions').innerHTML=`<h3>${activities[i][0]}</h3>${i===0?p(activities[i][1])+list(activities[i].slice(2)):i===1?activities[i].slice(1,3).map(p).join('')+list(activities[i].slice(3)):activities[i].slice(1).map(p).join('')}`;document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.stage===i));drawTimer()}
document.querySelector('.activity-print').innerHTML=activities.map((a,i)=>card(a[0],i===0?p(a[1])+list(a.slice(2)):i===1?a.slice(1,3).map(p).join('')+list(a.slice(3)):a.slice(1).map(p).join(''))).join('');
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>chooseActivity(+b.dataset.stage));
document.getElementById('timer-start').onclick=()=>{const t=timers[activity];if(!t.running&&t.remaining>0){t.end=performance.now()+t.remaining;t.running=true;drawTimer()}};
document.getElementById('timer-pause').onclick=()=>{const t=timers[activity];if(t.running)pauseTimer();else if(t.remaining>0){t.end=performance.now()+t.remaining;t.running=true;drawTimer()}};
document.getElementById('timer-reset').onclick=()=>{Object.assign(timers[activity],{remaining:900000,running:false,end:0});drawTimer()};
chooseActivity(0);setInterval(drawTimer,200);

/* === INDEPENDENT DISCUSSION CARDS; INPUT RETAINED IN THE DOM === */
document.querySelectorAll('#slide-12 .discussion-toggle:not(.other-open)').forEach((b,j)=>b.onclick=()=>{const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',(open?'Hide ':'Reveal ')+discussionAnswers[j][0]);b.querySelector('.question-mark').hidden=open;b.querySelector('.discussion-answer').hidden=!open;b.parentElement.classList.toggle('is-open',open)});

otherOpen.onclick=()=>showOtherIdeas(true);
document.querySelector('#slide-12 .other-close').onclick=()=>showOtherIdeas(false);


/* === ORDERING: DRAG, TOUCH, CLICK-TO-SWAP AND KEYBOARD === */
const hierarchyConcepts=['Research Domain','Research Topic','Research Problem','Research Question'];
const sortFrame=document.querySelector('#slide-14 .sort-frame');let selectedConcept=null,pointerStart=null,suppressSortClick=false;
function validateHierarchy(){const correct=[...sortFrame.children].every((b,j)=>+b.dataset.concept===j);sortFrame.classList.toggle('correct',correct);document.querySelector('.hierarchy-status').textContent=correct?'Correct order.':'';return correct}
function selectConcept(b){selectedConcept=selectedConcept===b?null:b;[...sortFrame.children].forEach(c=>{c.classList.toggle('selected',c===selectedConcept);c.setAttribute('aria-pressed',String(c===selectedConcept))})}
function swapConcepts(a,b){if(a===b)return;const marker=document.createComment('swap');a.replaceWith(marker);b.replaceWith(a);marker.replaceWith(b);selectedConcept=null;[...sortFrame.children].forEach(c=>{c.classList.remove('selected');c.setAttribute('aria-pressed','false')});validateHierarchy()}
function resetHierarchy(){const previous=[...sortFrame.children].map(b=>+b.dataset.concept).join();let order;do{order=[0,1,2,3];for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}}while(order.every((v,j)=>v===j)||order.join()===previous);sortFrame.innerHTML=order.map(j=>`<button class="card concept-card" data-concept="${j}" aria-pressed="false">${hierarchyConcepts[j]}</button>`).join('');selectedConcept=null;pointerStart=null;validateHierarchy()}
sortFrame.addEventListener('click',e=>{e.stopPropagation();if(suppressSortClick){suppressSortClick=false;return}const b=e.target.closest('.concept-card');if(!b)return;if(selectedConcept&&selectedConcept!==b)swapConcepts(selectedConcept,b);else selectConcept(b)});
sortFrame.addEventListener('pointerdown',e=>{const b=e.target.closest('.concept-card');if(!b||e.button!==0)return;pointerStart={b,x:e.clientX,y:e.clientY};b.setPointerCapture(e.pointerId)});
sortFrame.addEventListener('pointerup',e=>{if(!pointerStart)return;const start=pointerStart;pointerStart=null;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>12){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.concept-card');if(target&&sortFrame.contains(target))swapConcepts(start.b,target);suppressSortClick=true;setTimeout(()=>suppressSortClick=false,0)}});
sortFrame.addEventListener('pointercancel',()=>pointerStart=null);
sortFrame.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});sortFrame.addEventListener('touchend',e=>e.stopPropagation(),{passive:true});
sortFrame.addEventListener('keydown',e=>{const b=e.target.closest('.concept-card');if(!b)return;const delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-2,ArrowDown:2}[e.key];if(delta!==undefined){e.preventDefault();e.stopPropagation();const cards=[...sortFrame.children],j=cards.indexOf(b)+delta;if(j>=0&&j<4){swapConcepts(b,cards[j]);b.focus()}}else if(e.key==='Escape'){selectedConcept=null;[...sortFrame.children].forEach(c=>{c.classList.remove('selected');c.setAttribute('aria-pressed','false')})}});
document.getElementById('reset-hierarchy').onclick=resetHierarchy;resetHierarchy();
/* === ANCHORED EXPLANATION; NEVER CHANGES THE GRID DIMENSIONS === */
const cueHelp=document.querySelector('.cue-help'),cuePopup=document.getElementById('cue-popup');
function showCueExplanation(open){cuePopup.hidden=!open;cueHelp.setAttribute('aria-expanded',String(open));if(open)cuePopup.querySelector('button').focus();else cueHelp.focus()}
cueHelp.onclick=()=>showCueExplanation(cuePopup.hidden);cuePopup.querySelector('button').onclick=()=>showCueExplanation(false);
cuePopup.addEventListener('click',e=>e.stopPropagation());cuePopup.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();showCueExplanation(false)}});
